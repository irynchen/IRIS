server {
    server_name iris.goeloria.de iris.goeloria.com;

    root /var/www/iris/frontend/dist;
    index index.html;

    # Service Worker + Manifest niemals cachen (sonst sehen Nutzer veraltete PWA-Versionen)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Statische Assets: 1 Jahr cachen (Vite verwendet Content-Hash im Dateinamen)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/iris.goeloria.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iris.goeloria.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = iris.goeloria.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name iris.goeloria.de iris.goeloria.com;
    return 404;
}
